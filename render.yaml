services:
  - type: web
    name: keystone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://keystone-backend-9bb5.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
