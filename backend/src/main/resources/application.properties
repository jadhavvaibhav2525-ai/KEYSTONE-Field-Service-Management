spring.application.name=keystone

# Bootstrap administrator; keep the password in the deployment environment.
app.admin.email=${ADMIN_EMAIL:admin@keystone.com}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origin=${FRONTEND_URL:https://keystone-frontend-urjt.onrender.com}

# =========================================================
# PostgreSQL Database
# =========================================================
# Render:
#   Uses DATABASE_URL, DB_USERNAME and DB_PASSWORD
#
# Local:
#   Falls back to your local PostgreSQL database
# =========================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/keystone_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Vaibhav@0525}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# Server
# =========================================================

# Render provides PORT automatically.
# Local application will use 8082.
server.port=${PORT:8082}


# =========================================================
# Spring Security Logging
# =========================================================

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=DEBUG


# =========================================================
# Email Configuration
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true